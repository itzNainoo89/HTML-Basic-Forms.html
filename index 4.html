    <h1>Basic HTML Form</h1>

<form>

<fieldset>
<legend>Name</legend>

<label>First Name</label><br>
<input type="text"><br><br>

<label>Last Name</label><br>
<input type="text">

</fieldset>

<br>

<fieldset>
<legend>Other Questions</legend>

<label>Choose a drink:</label><br>

<input type="radio" name="drink">
<label>Coffee</label><br>

<input type="radio" name="drink">
<label>Tea</label><br>

<input type="radio" name="drink">
<label>Hot Chocolate</label>

<br><br>

<label>What ice cream do you like?</label><br>

<input type="checkbox">
<label>Chocolate</label><br>

<input type="checkbox">
<label>Chocolate Pudding</label><br>

<input type="checkbox">
<label>Chocolate Peanut Butter</label><br>

<input type="checkbox">
<label>Vanilla</label><br>

<input type="checkbox">
<label>Strawberry</label>

<br><br>

<label>Select a school:</label><br>

<select>
<option>Harvard</option>
<option>Oxford</option>
<option>MIT</option>
<option>Stanford</option>
</select>

<br><br>

<label>Please provide comments:</label><br>

<textarea rows="5" cols="40"></textarea>

</fieldset>

<br>

<input type="submit" value="Submit">

</form>
